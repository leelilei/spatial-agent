tracks:
  - id: foundation
    name: 项目基础
    accent: "#0071e3"
    order: 1
  - id: infrastructure
    name: 工程基础设施
    accent: "#ff9500"
    order: 2
  - id: experiments
    name: 实验阶段
    accent: "#34c759"
    order: 3
  - id: writing_release
    name: 写作与发布
    accent: "#af52de"
