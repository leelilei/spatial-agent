phases:
  - number: 0
    title: 项目卫生与版本管理
    track: foundation
    status: in_progress
    summary: 让 SMGA 工作区保持清楚、可恢复，并能按关键里程碑稳定提交。
    outputs:
      - 独立的 SMGA 项目结构
      - 可追踪的 todo 与进度地图
      - 关键里程碑的 git checkpoint

  - number: 1
    title: 研究计划与结构冻结
    track: foundation
    status: in_progress
    summary: 将 proposal、memory structure、scenario package 固定到足够支持工程实现的程度。
    outputs:
      - SMGA Proposal v4.6
      - Memory Schema v0.1
      - Scenario Package Schema v0.1

  - number: 2
    title: Experiment 0 基础设施
    track: infrastructure
    status: current
    summary: 把手写 seed_0001 变成稳定的 validate-load-score benchmark 闭环。
    outputs:
      - seed_0001 校验器
      - probe success scorer
      - benchmark_loader.py
      - normalized probe response schema

  - number: 3
    title: 第一轮 baseline 运行
    track: infrastructure
    status: planned
    summary: 先在 seed_0001 上跑非 SMGA baseline，拿到真实模型输出与失败案例。
    outputs:
      - M0_GA harness
      - M0_prompted harness
      - baseline probe responses
      - scorer 可读的 baseline JSON

  - number: 4
    title: SMGA treatment 与 ablations
    track: infrastructure
    status: planned
    summary: 将 actionable memory、placebo memory、memory-only ablations 接入同一 benchmark 管线。
    outputs:
      - memory artifact format
      - M3_actionable response path
      - M3_placebo construction
      - M2_memory_only serialization

  - number: 5
    title: Stage 1 pilot
    track: experiments
    status: planned
    summary: 用小规模 seed set 判断主实验是否值得扩展。
    outputs:
      - 5-seed pilot
      - placebo leakage check
      - claim extractor pilot
      - Gate 1 decision

  - number: 6
    title: Stage 2 主实验
    track: experiments
    status: planned
    summary: 跑出论文核心条件下的主结果表。
    outputs:
      - main condition runs
      - paired seed-level results
      - Holm correction 与 SESOI 判断
      - 可进入论文的结果表

  - number: 7
    title: Stage 2b 次级控制实验
    track: experiments
    status: planned
    summary: 补 reviewer 可能关心的 compute-matched 与 graph-style memory 控制条件。
    outputs:
      - M0_plus control
      - GraphMemory_social_schema control
      - secondary comparison CI
      - 最终 claim 边界判断

  - number: 8
    title: 分析、写作与发布
    track: writing_release
    status: planned
    summary: 将验证过的实验结果转成论文 draft 与可复现 release package。
    outputs:
      - paper skeleton 与 method sections
      - results 与 failure analysis
      - appendix assets
      - reproducible release package
