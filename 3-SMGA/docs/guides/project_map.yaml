    - id: discussion
      title: Discussion and limitations
      status: planned
      summary: Interpret grounded memory benefits, failure cases, and downgrade rules.
      assets:
        - path: docs/plans/SMGA-proposal-v4.6.md
          type: source
          status: ready
      blockers:
        - Needs observed failures and ablation results.
      nextActions:
        - Record failure cases during baseline scoring.
