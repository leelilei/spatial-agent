      title: Introduction
      status: planned
      summary: Motivate SMGA as a diagnostic architecture for socially grounded memory and planning.
      assets:
        - path: docs/plans/SMGA-proposal-v4.6.md
          type: source
          status: ready
      blockers:
        - Baseline result framing is not available yet.
      nextActions:
        - Turn proposal motivation into a short paper introduction.

    - id: related-work
      title: Related Work
      status: planned
      summary: Connect LLM social agents, memory architectures, and evaluation of grounded planning.
      assets:
        - path: docs/project/reference_sources.md
          type: source
          status: ready
      blockers:
        - Need final claim boundary after first baseline run.
      nextActions:
        - Convert reference notes into a compact related-work outline.

    - id: method
      title: Method
      status: draft
      summary: Describe scenario package, memory schema, response normalization, and probe success scoring.
      assets:
        - path: docs/project/smga_memory_schema_v0.1.md
          type: schema
          status: ready
        - path: docs/project/smga_scenario_package_schema_v0.1.md
          type: schema
          status: ready
        - path: docs/project/normalized_probe_response_schema_v0.1.md
          type: schema
          status: ready
      blockers:
        - Memory artifact format for M3 is not frozen.
      nextActions:
        - Draft the diagnostic benchmark construction and scoring subsections.

    - id: experiments
      title: Experiments
      status: blocked
      summary: Experimental conditions are conceptually clear but need real baseline and treatment outputs.
      assets:
