mapNodes:
  - id: project-setup
    title: Project hygiene and workspace split
    lane: done
    status: done
    phase: 0
    summary: SMGA became a separate project workspace with an active todo list and clear project documents.
    dependsOn: []
    outputs:
      - README.md
      - todolist.md
    nextActions: []

  - id: research-plan-freeze
    title: Proposal and schema freeze
    lane: done
    status: done
    phase: 1
    summary: The research plan, memory object, scenario package, and response schema are stable enough to support implementation.
    dependsOn:
      - project-setup
    outputs:
      - SMGA Proposal v4.6
      - Memory Schema v0.1
      - Scenario Package Schema v0.1
      - Normalized Probe Response Schema v0.1
    nextActions: []

  - id: experiment-0-infra
    title: Experiment 0 infrastructure
    lane: done
    status: done
    phase: 2
    summary: A hand-authored diagnostic seed can now be validated, loaded, and scored end to end.
    dependsOn:
      - research-plan-freeze
    outputs:
      - benchmark_loader.py
      - validate_seed.py
      - probe_success_scorer.py
    nextActions: []

  - id: baseline-runs
    title: First baseline runs
    lane: now
    status: current
    phase: 3
    summary: Generate and normalize M0_GA and M0_prompted responses for seed_0001, then score them with the probe success scorer.
    dependsOn:
      - experiment-0-infra
    outputs:
      - baseline model config
      - M0_GA scorer-readable JSON
      - M0_prompted scorer-readable JSON
      - baseline failure case notes
    nextActions:
      - Freeze provider, model version, temperature, and decoding settings.
      - Generate M0_GA raw model outputs for seed_0001.
      - Generate M0_prompted raw model outputs for seed_0001.
      - Score both baselines and record failure cases.
    taskRefs:
      - P3-06
      - P3-07
      - P3-08
      - P3-11
      - P3-12
      - P3-13

  - id: smga-treatment
    title: SMGA treatment and ablations
    lane: next
    status: next
    phase: 4
    summary: Add actionable memory, placebo memory, and memory-only ablations to the same benchmark and scorer pipeline.
    dependsOn:
      - baseline-runs
    outputs:
      - memory artifact format
      - M3_actionable response path
      - M3_placebo construction
      - M2_memory_only serialization
    nextActions:
      - Define the memory artifact output format.
      - Implement minimal M3_actionable memory formation.
      - Implement M3_placebo stale memory construction.
    taskRefs:
      - P4-01
      - P4-02
      - P4-05

  - id: stage-1-pilot
    title: Stage 1 pilot
    lane: next
    status: planned
    phase: 5
    summary: Run a small seed set to decide whether the main experiment is worth scaling.
    dependsOn:
      - smga-treatment
    outputs:
      - 5-seed pilot
      - placebo leakage check
      - claim extractor pilot
      - Gate 1 decision
    nextActions:
      - Expand to five diagnostic seeds.
      - Validate placebo leakage.
      - Decide Stage 2 seed budget.

  - id: stage-2-main-experiment
    title: Stage 2 main experiment
    lane: next
    status: planned
    phase: 6
    summary: Scale up evaluations on a larger set of seeds to establish statistical significance for SMGA grounding benefits.
    dependsOn:
      - stage-1-pilot
    outputs:
      - 30-seed benchmark runs
      - SMGA vs baseline stats
    nextActions:
      - Generate full benchmark suite.
      - Execute batch model runners.

  - id: stage-2b-secondary-controls
    title: Stage 2b secondary controls
    lane: next
    status: planned
    phase: 7
    summary: Run placebo and ablation controls to isolate the social grounding and memory claims.
    dependsOn:
      - stage-2-main-experiment
    outputs:
      - Placebo ablation data
      - Memory-only ablation data
    nextActions:
      - Execute control conditions.

  - id: paper-readiness
    title: Paper readiness
    lane: paper
    status: planned
    phase: 8
    summary: The paper skeleton can start, but results and ablations are blocked on baseline and treatment runs.
    dependsOn:
      - stage-2b-secondary-controls
    outputs:
      - Introduction and method skeleton
      - Benchmark construction section
      - Experimental conditions section
      - Results and failure analysis
    nextActions:
      - Draft Introduction and Method once baseline design is fixed.
      - Keep Results and Discussion blocked until scorer outputs exist.

paper:
