<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>研究进度看板</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地研究工作区</p>
          <h1>研究进度看板</h1>
        </div>
        <div class="topbar-actions">
          <p id="last-updated" class="muted">加载中...</p>
          <button id="refresh-button" type="button">刷新</button>
        </div>
      </header>

      <main>
        <section id="home-view">
          <div class="section-title">
            <p class="eyebrow">所有项目</p>
            <h2>项目总览</h2>
          </div>
          <section id="summary" class="summary-grid" aria-label="工作区汇总"></section>
          <section id="source-grid" class="source-grid" aria-label="项目总览"></section>
        </section>

        <section id="project-view" hidden>
          <section class="project-hero">
            <button id="back-button" class="back-button" type="button">返回所有项目</button>
            <div class="project-heading">
              <div>
                <p class="eyebrow">项目详情</p>
                <h2 id="project-title">项目详情</h2>
              </div>
              <p id="project-mainline" class="project-mainline"></p>
            </div>
            <div id="project-metrics" class="project-metrics"></div>
          </section>

          <section class="workspace-grid">
            <div class="roadmap-panel">
              <div class="section-title">
                <p class="eyebrow">路线图</p>
                <h2 id="roadmap-title">项目路线图</h2>
              </div>
              <div id="roadmap"></div>
            </div>

            <aside class="side-panel">
              <div class="section-title">
                <p class="eyebrow">当前行动</p>
                <h2 id="now-title">下一步</h2>
              </div>
              <div id="next-actions"></div>
            </aside>
          </section>

          <section class="task-board">
            <div class="section-title">
              <p class="eyebrow">执行任务</p>
              <h2 id="task-title">优先级任务板</h2>
            </div>
            <div id="task-columns" class="task-columns"></div>
          </section>
        </section>
      </main>
    </div>

    <div id="phase-modal" class="modal-backdrop" hidden>
      <section class="phase-modal" role="dialog" aria-modal="true" aria-labelledby="phase-modal-title">
        <button id="phase-modal-close" class="modal-close" type="button" aria-label="关闭详情">×</button>
        <div id="phase-modal-content"></div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
