<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Cockpit</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main>
        <section id="home-view">
          <div class="home-appbar">
            <h1 class="home-title">Research Cockpit</h1>
            <div class="home-appbar-actions">
              <p id="last-updated" class="muted">加载中...</p>
              <button id="refresh-button" type="button">刷新</button>
            </div>
          </div>

          <section id="summary" class="summary-grid" aria-label="工作区汇总"></section>

          <section id="trend-section" class="trend-panel" style="display: none; margin-bottom: 22px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);">
            <div class="section-title">
              <p class="eyebrow">Progress Trend</p>
              <h2>进度积累走势</h2>
            </div>
            <div class="trend-chart-container" style="position: relative;">
              <svg id="trend-chart" class="trend-chart" viewBox="0 0 800 220" preserveAspectRatio="none" style="width: 100%; height: 220px; overflow: visible; display: block;"></svg>
              <div id="trend-legend" class="trend-legend" style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; justify-content: center; font-size: 13px;"></div>
            </div>
          </section>

          <section id="source-grid" class="source-grid" aria-label="项目列表"></section>
        </section>

        <section id="project-view" hidden>
          <div class="project-topbar">
            <div class="project-topbar-main">
              <button id="back-button" class="back-button" type="button">← 返回</button>
              <h2 id="project-title" class="project-title-sm">项目详情</h2>
              <p id="project-mainline" class="project-focus-inline"></p>
            </div>
            <nav id="project-nav" class="project-nav"></nav>
          </div>

          <p id="research-question" class="research-question"></p>

          <div class="project-detail-layout">
            <div class="project-map-workspace">
              <section id="overview-section" class="overview-panel project-section project-page" data-section="overview">
                <div id="project-overview"></div>
              </section>

              <section id="project-map-section" class="project-map-panel project-section project-page" data-section="map">
                <div id="project-map" class="project-map"></div>
              </section>

              <section id="history-section" class="history-panel project-section project-page" data-section="history">
                <div id="project-history"></div>
              </section>

              <section id="paper-readiness-section" class="paper-readiness-panel project-section project-page" data-section="paper">
                <div id="paper-readiness"></div>
              </section>

              <section id="decisions-section" class="decisions-panel project-section project-page" data-section="decisions">
                <div id="project-decisions"></div>
              </section>

              <section id="artifacts-section" class="artifacts-panel project-section project-page" data-section="artifacts">
                <div id="project-artifacts"></div>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
