<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Project Map</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Research Workspace</p>
          <h1>Research Project Map</h1>
        </div>
        <div class="topbar-actions">
          <p id="last-updated" class="muted">加载中...</p>
          <button id="refresh-button" type="button">刷新</button>
        </div>
      </header>

      <main>
        <section id="home-view">
          <div class="section-title">
            <p class="eyebrow">All Projects</p>
            <h2>项目总览</h2>
          </div>
          <section id="summary" class="summary-grid" aria-label="工作区汇总"></section>
          <section id="source-grid" class="source-grid" aria-label="项目列表"></section>
        </section>

        <section id="project-view" hidden>
          <div class="project-detail-layout">
            <aside class="project-nav-panel" aria-label="研究地图导航">
              <div class="project-nav-shell">
                <p class="eyebrow">Map Views</p>
                <nav id="project-nav" class="project-nav"></nav>
              </div>
            </aside>

            <div class="project-map-workspace">
              <section id="project-map-section" class="project-map-panel project-section" data-section="map">
                <button id="back-button" class="back-button" type="button">返回所有项目</button>
                <div class="project-map-header">
                  <div>
                    <p class="eyebrow">Research Project</p>
                    <h2 id="project-title">项目详情</h2>
                  </div>
                  <div class="project-focus-card">
                    <span>Current Focus</span>
                    <p id="project-mainline"></p>
                  </div>
                </div>
                <p id="research-question" class="research-question"></p>
                <div id="project-map" class="project-map"></div>
              </section>

              <section id="history-section" class="history-panel project-section" data-section="history">
                <div class="section-title">
                  <p class="eyebrow">History</p>
                  <h2>之前做过什么</h2>
                </div>
                <div id="project-history"></div>
              </section>

              <section id="next-work-section" class="next-work-panel project-section" data-section="next">
                <div class="section-title">
                  <p class="eyebrow">Next Work</p>
                  <h2>之后需要做什么</h2>
                </div>
                <div id="next-work"></div>
              </section>

              <section id="paper-readiness-section" class="paper-readiness-panel project-section" data-section="paper">
                <div class="section-title">
                  <p class="eyebrow">Paper Readiness</p>
                  <h2>论文准备度</h2>
                </div>
                <div id="paper-readiness"></div>
              </section>
            </div>

            <aside class="map-detail-drawer" aria-label="地图节点详情">
              <div id="map-node-detail"></div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
