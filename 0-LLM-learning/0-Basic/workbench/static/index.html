<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的学习工作台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>📚 我的学习工作台</h1>
    <nav>
      <button class="tab active" data-tab="home">总览</button>
      <button class="tab" data-tab="course">课程</button>
      <button class="tab" data-tab="work">练习</button>
      <button class="tab" data-tab="psets">习题集</button>
    </nav>
  </header>

  <main>
    <!-- 总览 -->
    <section id="tab-home" class="tab-panel active">
      <div id="current-card" class="card highlight">加载中…</div>
      <h2>五阶段路线</h2>
      <div id="stages"></div>
      <div id="vibecoding" class="card subtle"></div>
    </section>

    <!-- 课程 -->
    <section id="tab-course" class="tab-panel">
      <p class="muted">点课名打开本地讲义/代码；学完点「检查点」确认掌握。
        <span class="legend">✅必学 🔶理解即可 ⏸️可跳过</span></p>
      <div id="lecture-list"></div>
    </section>

    <!-- 练习（浏览器内小题） -->
    <section id="tab-work" class="tab-panel">
      <div id="work-area">加载中…</div>
    </section>

    <!-- 习题集（VSCode + 真实 Python） -->
    <section id="tab-psets" class="tab-panel">
      <p class="muted">这是 6.100L 的官方习题集（多文件项目）。用 <b>VSCode + 真实 Python</b> 做：
        解压 → 打开 → 写代码 → 跑官方测试 → 让 AI 点评。</p>
      <div id="pset-list">加载中…</div>
    </section>
  </main>

  <!-- 做题/检查点 弹层 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modal-close" class="close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Pyodide：浏览器内运行 Python -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
