<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Agent-accessible spatial representation taxonomy</title>
  <desc id="desc">A left-to-right L0-L5 taxonomy that emphasizes coding what the agent receives rather than backend richness.</desc>
  <defs>
    <style>
      .bg { fill: #f8f8f5; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 8; }
      .level0 { fill: #eeeeee; }
      .level1 { fill: #e9edf4; }
      .level2 { fill: #e4f0ec; }
      .level3 { fill: #dcebd6; }
      .level4 { fill: #fff0c7; }
      .level5 { fill: #e8dcd4; }
      .warning { fill: #fff8e8; stroke: #8a651f; stroke-width: 2; rx: 8; }
      .title { font: 700 32px Georgia, serif; fill: #171717; }
      .subtitle { font: 700 22px Georgia, serif; fill: #171717; }
      .level { font: 700 26px Helvetica, Arial, sans-serif; fill: #111111; }
      .label { font: 700 18px Helvetica, Arial, sans-serif; fill: #111111; }
      .text { font: 16px Helvetica, Arial, sans-serif; fill: #171717; }
      .small { font: 14px Helvetica, Arial, sans-serif; fill: #333333; }
      .arrow { stroke: #222222; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #555555; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="920"/>
  <text class="title" x="70" y="60">Figure 3. Agent-Accessible Spatial Representation Taxonomy</text>
  <text class="text" x="70" y="92">Coding rule: classify what the agent can consume, not what the simulator stores or the analyst computes.</text>

  <text class="subtitle" x="70" y="145">Increasing structural explicitness in agent-facing input</text>
  <path class="arrow" d="M75 165 L1400 165"/>

  <rect class="box level0" x="70" y="205" width="210" height="230"/>
  <text class="level" x="95" y="245">L0</text>
  <text class="label" x="95" y="278">No spatial input</text>
  <text class="text" x="95" y="315">No place, relation,</text>
  <text class="text" x="95" y="338">route, or geometry</text>
  <text class="small" x="95" y="395">Rows: 0</text>

  <rect class="box level1" x="300" y="205" width="210" height="230"/>
  <text class="level" x="325" y="245">L1</text>
  <text class="label" x="325" y="278">Labels</text>
  <text class="text" x="325" y="315">Place or action-space</text>
  <text class="text" x="325" y="338">labels without relations</text>
  <text class="small" x="325" y="395">Rows: 1</text>

  <rect class="box level2" x="530" y="205" width="210" height="230"/>
  <text class="level" x="555" y="245">L2</text>
  <text class="label" x="555" y="278">Semantic scene</text>
  <text class="text" x="555" y="315">Descriptive place</text>
  <text class="text" x="555" y="338">information, no topology</text>
  <text class="small" x="555" y="395">Rows: 8</text>

  <rect class="box level3" x="760" y="205" width="210" height="230"/>
  <text class="level" x="785" y="245">L3</text>
  <text class="label" x="785" y="278">Local relations</text>
  <text class="text" x="785" y="315">Adjacency, co-presence,</text>
  <text class="text" x="785" y="338">local movement, feeds</text>
  <text class="small" x="785" y="395">Rows: 18</text>

  <rect class="box level4" x="990" y="205" width="210" height="230"/>
  <text class="level" x="1015" y="245">L4</text>
  <text class="label" x="1015" y="278">Global abstract</text>
  <text class="text" x="1015" y="315">Configurational or</text>
  <text class="text" x="1015" y="338">network-wide structure</text>
  <text class="small" x="1015" y="395">Rows: 1</text>

  <rect class="box level5" x="1220" y="205" width="210" height="230"/>
  <text class="level" x="1245" y="245">L5</text>
  <text class="label" x="1245" y="278">Geometry</text>
  <text class="text" x="1245" y="315">Coordinates, visual field,</text>
  <text class="text" x="1245" y="338">embodiment, constraints</text>
  <text class="small" x="1245" y="395">Rows: 6</text>

  <text class="subtitle" x="70" y="510">Backend representation is coded separately</text>
  <rect class="box" x="70" y="545" width="260" height="95"/>
  <text class="label" x="100" y="583">text-only</text>
  <text class="small" x="100" y="612">May still expose L1-L3 input</text>

  <rect class="box" x="360" y="545" width="260" height="95"/>
  <text class="label" x="390" y="583">2D_grid</text>
  <text class="small" x="390" y="612">Often local movement / co-presence</text>

  <rect class="box" x="650" y="545" width="260" height="95"/>
  <text class="label" x="680" y="583">graph_based</text>
  <text class="small" x="680" y="612">L3 unless global structure is agent-facing</text>

  <rect class="box" x="940" y="545" width="260" height="95"/>
  <text class="label" x="970" y="583">3D_engine</text>
  <text class="small" x="970" y="612">Not automatically L5</text>

  <rect class="warning" x="190" y="710" width="1120" height="95"/>
  <text class="label" x="230" y="748">Coding caution</text>
  <text class="text" x="230" y="780">Rich backend worlds, GIS substrates, 3D engines, or researcher-side network metrics do not raise the level unless the information is available to the agent.</text>

  <path class="dash" d="M1070 545 C1110 505 1110 455 1095 435"/>
  <text class="small" x="1120" y="500">Only counts as L4 if global</text>
  <text class="small" x="1120" y="520">structure is agent-facing.</text>

  <path class="dash" d="M1070 545 C1215 500 1285 470 1325 435"/>
  <text class="small" x="1160" y="690">Only counts as L5 if geometry or embodiment</text>
  <text class="small" x="1160" y="710">is directly consumed by the agent.</text>

  <text class="small" x="70" y="865">Stable widened-Core distribution: L1 = 1, L2 = 8, L3 = 18, L4 = 1, L5 = 6. L4 appears only in a widened digital-network bridge case.</text>
  <text class="small" x="70" y="890">L5 rows are heterogeneous: embodied geometry, platform support, cooperation benchmarks, and VR guidance license different claims.</text>
</svg>
