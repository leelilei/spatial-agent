version: 1
project: 4-SpatialAgent-Survey
currentPhase: 2

# 标准 4-track 骨架（见 0-Tools/research-standard）。综述项目：编码与证据分析
# 视为 experiment（产出综述的证据），论文写作与投稿归 write。阶段取自 survey_plan.md
# 的执行计划（Phase 0-3），track 归属可按需微调。
tracks:
  - id: design
    name: 设计
    accent: "#0071e3"
    order: 1
  - id: experiment
    name: 实验
    accent: "#34c759"
    order: 3
  - id: write
    name: 写作
    accent: "#af52de"
    order: 4

phases:
  - number: 0
    title: Review Protocol 与 Evidence Matrix
    track: design
    status: done
    summary: 固定研究问题、检索与纳排标准、编码方案与 claim matrix；建立 widened-Core 证据基线。
    outputs:
      - Review Protocol
      - claim_matrix.md
      - coding_manual.md

  - number: 1
    title: 编码与分析
    track: experiment
    status: done
    summary: 完成 corpus 筛选与 shortlist closure，稳定 widened-Core evidence map 与表征/缺口分析。
    outputs:
      - widened-Core evidence map（34 rows / 32 papers）
      - representation 分布与 L4 gap 分析
      - appendix evidence table

  - number: 2
    title: 论文写作
    track: write
    status: current
    summary: 固定 §3 Evidence Map 计数与图表口径，将 §3-§6 scaffold 推进到 paragraph-level drafting。
    outputs:
      - §3 Evidence Map 定稿
      - §3-§6 正文初稿
      - 核心图表（Table 3/4、Figure 2/3）

  - number: 3
    title: 修订与投稿
    track: write
    status: planned
    summary: 全文 claim check、参考文献核对与图表收尾，按投稿策略完成修订与提交。
    outputs:
      - 全文 draft
      - 投稿包
