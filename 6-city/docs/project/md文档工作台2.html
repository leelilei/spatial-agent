  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
  const timeStr = now.toTimeString().slice(0, 8).replace(/:/g, '');
  const filename = '表格_' + dateStr + '_' + timeStr + '.xlsx';

  XLSX.writeFile(wb, filename);
  toast('Excel 文件已导出', 'success');
}

// ═══════════════════════════════════════════
// HTML -> docx Conversion Utilities
// ═══════════════════════════════════════════
function docxConvertContainer(container) {
  const elements = [];
  for (const node of container.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.textContent.trim();
      if (text) {
        elements.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: text })],
        }));
      }
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      const converted = docxConvertElement(node);
      if (Array.isArray(converted)) {
        elements.push(...converted);
      } else if (converted) {
        elements.push(converted);
      }
    }
  }
  return elements;
}

function docxConvertElement(node) {
  const tag = node.tagName.toUpperCase();

  switch (tag) {
    case 'H1':
      return new docx.Paragraph({
        children: docxParseInline(node, {}),
        heading: docx.HeadingLevel.HEADING_1,
      });
    case 'H2':
      return new docx.Paragraph({
        children: docxParseInline(node, {}),
        heading: docx.HeadingLevel.HEADING_2,
      });
    case 'H3':
      return new docx.Paragraph({
        children: docxParseInline(node, {}),
        heading: docx.HeadingLevel.HEADING_3,
      });
    case 'H4': case 'H5': case 'H6':
      return new docx.Paragraph({
        children: docxParseInline(node, { bold: true }),
        spacing: { before: 200, after: 120 },
      });
    case 'P':
      return new docx.Paragraph({
        children: docxParseInline(node, {}),
        spacing: { after: 200 },
      });
    case 'TABLE':
      return docxConvertTable(node);
    case 'UL':
      return docxConvertList(node, false, 0);
    case 'OL':
      return docxConvertList(node, true, 0);
    case 'BLOCKQUOTE':
      return docxConvertBlockquote(node);
    case 'PRE':
      return docxConvertPre(node);
    case 'HR':
      return new docx.Paragraph({
        thematicBreak: true,
        spacing: { before: 240, after: 240 },
      });
    case 'BR':
      return new docx.Paragraph({ children: [] });
    case 'DIV':
      return docxConvertContainer(node);
    case 'IMG':
      const alt = node.getAttribute('alt') || '图片';
      return new docx.Paragraph({
        children: [new docx.TextRun({ text: '[' + alt + ']', italics: true, color: '999999' })],
        spacing: { after: 200 },
      });
    default:
      if (node.children && node.children.length > 0) {
        return docxConvertContainer(node);
      }
      const text = node.textContent.trim();
      if (text) {
        return new docx.Paragraph({
          children: docxParseInline(node, {}),
        });
      }
      return null;
  }
}

function docxParseInline(node, parentStyle) {
  const runs = [];
  for (const child of node.childNodes) {
    if (child.nodeType === Node.TEXT_NODE) {
      const text = child.textContent;
      if (text) {
        const runOpts = { text: text };
        if (parentStyle.bold) runOpts.bold = true;
        if (parentStyle.italics) runOpts.italics = true;
        if (parentStyle.underline) runOpts.underline = { type: docx.UnderlineType.SINGLE };
        if (parentStyle.strike) runOpts.strike = true;
        if (parentStyle.font) runOpts.font = parentStyle.font;
        if (parentStyle.size) runOpts.size = parentStyle.size;
        if (parentStyle.color) runOpts.color = parentStyle.color;
        runs.push(new docx.TextRun(runOpts));
      }
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      const childTag = child.tagName.toUpperCase();

      if (childTag === 'BR') {
        runs.push(new docx.TextRun({ break: 1 }));
        continue;
      }

      const newStyle = Object.assign({}, parentStyle);
      switch (childTag) {
        case 'STRONG': case 'B':
          newStyle.bold = true; break;
        case 'EM': case 'I':
          newStyle.italics = true; break;
        case 'U':
          newStyle.underline = true; break;
        case 'S': case 'DEL': case 'STRIKE':
          newStyle.strike = true; break;
        case 'CODE':
          newStyle.font = 'Courier New';
          newStyle.size = 20;
          break;
        case 'A':
          newStyle.color = 'C0935A';
          newStyle.underline = true;
          break;
      }
      runs.push(...docxParseInline(child, newStyle));
    }
  }
  return runs;
}

function docxConvertTable(tableNode) {
  const rows = [];
  const allTrs = tableNode.querySelectorAll('tr');

  allTrs.forEach(function(tr, rowIdx) {
    const cells = [];
    const isHeader = (tr.closest('thead') !== null) || (rowIdx === 0 && tr.querySelector('th'));

    tr.querySelectorAll('th, td').forEach(function(td) {
      const cellChildren = docxParseInline(td, isHeader ? { bold: true } : {});
      const cellOpts = {
        children: [new docx.Paragraph({
          children: cellChildren.length > 0 ? cellChildren : [new docx.TextRun({ text: '' })],
          alignment: isHeader ? docx.AlignmentType.CENTER : docx.AlignmentType.LEFT,
        })],
        verticalAlign: docx.VerticalAlign.CENTER,
      };
      if (isHeader) {
        cellOpts.shading = { fill: 'F0EEE9', type: docx.ShadingType.CLEAR, color: 'auto' };
      }
      cells.push(new docx.TableCell(cellOpts));
    });

    if (cells.length > 0) {
      rows.push(new docx.TableRow({
        children: cells,
        tableHeader: isHeader,
      }));
    }
  });

  if (rows.length === 0) return null;

  return new docx.Table({
    rows: rows,
    width: { size: 100, type: docx.WidthType.PERCENTAGE },
  });
}

function docxConvertList(listNode, ordered, depth) {
  const items = [];
  let itemIndex = 0;

  const liNodes = listNode.querySelectorAll(':scope > li');
  liNodes.forEach(function(li) {
    const prefix = ordered ? ((itemIndex + 1) + '. ') : '• ';
    const directRuns = [];
    for (const child of li.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        const text = child.textContent;
        if (text.trim()) {
          directRuns.push(new docx.TextRun({ text: text }));
        }
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        const childTag = child.tagName.toUpperCase();
        if (childTag !== 'UL' && childTag !== 'OL') {
          directRuns.push(...docxParseInline(child, {}));
        }
      }
    }

    directRuns.unshift(new docx.TextRun({ text: prefix }));

    items.push(new docx.Paragraph({
      children: directRuns,
      indent: { left: 360 * (depth + 1) },
      spacing: { after: 80 },
    }));

    const nestedUl = li.querySelector(':scope > ul');
    const nestedOl = li.querySelector(':scope > ol');
    if (nestedUl) items.push(...docxConvertList(nestedUl, false, depth + 1));
    if (nestedOl) items.push(...docxConvertList(nestedOl, true, depth + 1));

    itemIndex++;
  });

  return items;
}

function docxConvertBlockquote(node) {
  const elements = [];
  for (const child of node.childNodes) {
    if (child.nodeType === Node.ELEMENT_NODE) {
      elements.push(new docx.Paragraph({
        children: docxParseInline(child, { italics: true, color: '555555' }),
        indent: { left: 720 },
        spacing: { after: 120 },
        border: {
          left: { style: docx.BorderStyle.SINGLE, size: 6, color: 'C0935A', space: 10 },
        },
      }));
    } else if (child.nodeType === Node.TEXT_NODE && child.textContent.trim()) {
      elements.push(new docx.Paragraph({
        children: [new docx.TextRun({ text: child.textContent.trim(), italics: true, color: '555555' })],
        indent: { left: 720 },
        border: {
          left: { style: docx.BorderStyle.SINGLE, size: 6, color: 'C0935A', space: 10 },
        },
      }));
    }
  }
  return elements.length > 0 ? elements : [new docx.Paragraph({ children: [] })];
}

function docxConvertPre(node) {
  const text = node.textContent || '';
  const lines = text.split('\n');
  const runs = [];
  lines.forEach(function(line, i) {
    runs.push(new docx.TextRun({
      text: line,
      font: 'Courier New',
      size: 20,
    }));
    if (i < lines.length - 1) {
      runs.push(new docx.TextRun({ break: 1 }));
    }
  });
  return new docx.Paragraph({
    children: runs,
    shading: { fill: 'F5F5F5', type: docx.ShadingType.CLEAR, color: 'auto' },
    spacing: { before: 240, after: 240 },
  });
}

// ═══════════════════════════════════════════
// PDF Merge
// ═══════════════════════════════════════════
let pdfFiles = [];

function openMergeModal() {
  pdfFiles = [];
  renderMergeFileList();
  document.getElementById('merge-modal').classList.add('active');
}

function handlePDFFileSelect(event) {
  const files = Array.from(event.target.files);
  files.forEach(file => {
    if (file.type === 'application/pdf') {
      pdfFiles.push({
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        file: file,
        name: file.name
      });
    } else {
      toast(`文件「${file.name}」不是 PDF 格式，已跳过`, 'error');
    }
  });
  renderMergeFileList();
  event.target.value = '';
}

function renderMergeFileList() {
  const listEl = document.getElementById('merge-file-list');
  const emptyEl = document.getElementById('merge-empty-state');
  const mergeBtn = document.getElementById('merge-btn');

  if (pdfFiles.length === 0) {
    emptyEl.style.display = 'block';
    mergeBtn.disabled = true;
    const items = listEl.querySelectorAll('.merge-file-item');
    items.forEach(item => item.remove());
  } else {
    emptyEl.style.display = 'none';
    mergeBtn.disabled = false;
    const items = listEl.querySelectorAll('.merge-file-item');
    items.forEach(item => item.remove());

    pdfFiles.forEach((pdfFile, index) => {
      const item = document.createElement('div');
      item.className = 'merge-file-item';
      item.draggable = true;
      item.dataset.id = pdfFile.id;
      item.dataset.index = index;
      item.innerHTML = `
        <span class="drag-handle"><svg><use href="#icon-menu"/></svg></span>
        <span class="merge-file-icon" style="flex-shrink:0"><svg><use href="#icon-file"/></svg></span>
        <span class="merge-file-name">${pdfFile.name}</span>
        <button class="merge-file-remove" onclick="removePDFFile('${pdfFile.id}')">删除</button>
      `;

      item.addEventListener('dragstart', mergeHandleDragStart);
      item.addEventListener('dragover', mergeHandleDragOver);
      item.addEventListener('drop', mergeHandleDrop);
      item.addEventListener('dragend', mergeHandleDragEnd);
      item.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });

      listEl.appendChild(item);
    });
  }
}

let mergeDraggedElement = null;

function mergeHandleDragStart(e) {
  mergeDraggedElement = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function mergeHandleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (this !== mergeDraggedElement) {
    this.classList.add('drag-over');
  }
  return false;
}

function mergeHandleDrop(e) {
  e.stopPropagation();
  if (mergeDraggedElement !== this) {
    const draggedId = mergeDraggedElement.dataset.id;
    const targetId = this.dataset.id;
    const draggedIndex = pdfFiles.findIndex(f => f.id === draggedId);
    const targetIndex = pdfFiles.findIndex(f => f.id === targetId);
    [pdfFiles[draggedIndex], pdfFiles[targetIndex]] = [pdfFiles[targetIndex], pdfFiles[draggedIndex]];
    renderMergeFileList();
  }
  this.classList.remove('drag-over');
  return false;
}

function mergeHandleDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('.merge-file-item').forEach(item => item.classList.remove('drag-over'));
}

function removePDFFile(id) {
  pdfFiles = pdfFiles.filter(f => f.id !== id);
  renderMergeFileList();
}

function clearPDFList() {
  if (pdfFiles.length > 0) {
    pdfFiles = [];
    renderMergeFileList();
    toast('文件列表已清空', 'info');
  }
}

async function mergePDFs() {
  if (pdfFiles.length === 0) {
    toast('请至少选择一个 PDF 文件', 'error');
    return;
  }

  if (typeof PDFLib === 'undefined') {
    toast('PDF 库未加载，请刷新页面重试', 'error');
    return;
  }

  const mergeBtn = document.getElementById('merge-btn');
  mergeBtn.textContent = '合并中...';
  mergeBtn.disabled = true;

  try {
    const mergedPdf = await PDFLib.PDFDocument.create();

    for (let i = 0; i < pdfFiles.length; i++) {
      const pdfFile = pdfFiles[i];
      const arrayBuffer = await pdfFile.file.arrayBuffer();
      const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
      const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(page => mergedPdf.addPage(page));
    }

    const pdfBytes = await mergedPdf.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `合并PDF_${new Date().toISOString().slice(0,10).replace(/-/g, '')}_${new Date().toTimeString().slice(0,8).replace(/:/g, '')}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    toast(`成功合并 ${pdfFiles.length} 个 PDF 文件`, 'success');
    closeModal('merge-modal');
  } catch (error) {
    console.error('PDF合并失败:', error);
    toast('PDF 合并失败：' + (error.message || error), 'error');
  } finally {
    mergeBtn.textContent = '合并并下载';
    mergeBtn.disabled = false;
  }
}

function setupMergeDropZone() {
  const area = document.getElementById('merge-file-input-area');
  if (!area) return;

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    area.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
  });

  area.addEventListener('dragenter', () => area.classList.add('drag-over'));
  area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
  area.addEventListener('drop', (e) => {
    area.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files);
    files.forEach(file => {
      if (file.type === 'application/pdf') {
        pdfFiles.push({
          id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          file: file,
          name: file.name
        });
      } else {
        toast(`文件「${file.name}」不是 PDF 格式，已跳过`, 'error');
      }
    });
    renderMergeFileList();
  });
}

// ═══════════════════════════════════════════
// UI Controls
// ═══════════════════════════════════════════
function toggleSidebar() {
  state.sidebarVisible = !state.sidebarVisible;
  document.getElementById('sidebar').classList.toggle('collapsed', !state.sidebarVisible);
}

function toggleFileList() {
  state.fileListCollapsed = !state.fileListCollapsed;
  const wrap = document.getElementById('file-list-wrap');
  const toggleBtn = document.getElementById('file-list-toggle');
  if (wrap) wrap.classList.toggle('collapsed', state.fileListCollapsed);
  if (toggleBtn) toggleBtn.textContent = state.fileListCollapsed ? '›' : '▼';
  localStorage.setItem('md-workbench-file-list-collapsed', state.fileListCollapsed ? 'true' : '');
}

function setView(view) {
  state.view = view;
  document.getElementById('editor-area').setAttribute('data-view', view);
  document.querySelectorAll('.view-toggle .toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-view') === view);
  });
}

function setThemeButtonIcon(theme) {
  const btn = document.getElementById('theme-btn');
  if (!btn) return;
  const icon = btn.querySelector('.btn-icon');
  if (!icon) return;
  icon.innerHTML = theme === 'dark' ? '<svg><use href="#icon-sun"/></svg>' : '<svg><use href="#icon-moon"/></svg>';
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    state.theme = 'light';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    state.theme = 'dark';
  }
  setThemeButtonIcon(state.theme);
  localStorage.setItem('contract-theme', state.theme);
}

function toggleSearch() {
  const bar = document.getElementById('search-bar');
  bar.classList.toggle('active');
  if (bar.classList.contains('active')) {
    document.getElementById('search-input').focus();
  }
}

function handleSearch() {
  const query = document.getElementById('search-input').value;
  if (!query) return;

  const editor = document.getElementById('markdown-editor');
  const idx = editor.value.toLowerCase().indexOf(query.toLowerCase(), editor.selectionEnd);
  if (idx >= 0) {
    editor.focus();
    editor.setSelectionRange(idx, idx + query.length);
  }
}

function confirmClear() {
  const editor = document.getElementById('markdown-editor');
  if (!editor.value.trim()) return;
  document.getElementById('confirm-modal').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function executeClear() {
  document.getElementById('markdown-editor').value = '';
  state.files[state.activeFile] = '';
  updatePreview();
  autoSave();
  closeModal('confirm-modal');
  toast('编辑器已清空', 'info');
}

// ═══════════════════════════════════════════
// Drag & Drop (Markdown files)
// ═══════════════════════════════════════════
function setupDragDrop() {
  let dragCounter = 0;
  const overlay = document.getElementById('drop-overlay');

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    // Only show overlay for file drops, not for PDF merge reordering
    if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
      // Don't show if merge modal is active
      if (!document.getElementById('merge-modal').classList.contains('active')) {
        dragCounter++;
        overlay.classList.add('active');
      }
    }
  });

  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      overlay.classList.remove('active');
    }
  });

  document.addEventListener('dragover', (e) => e.preventDefault());

  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (file && (file.name.endsWith('.md') || file.name.endsWith('.txt') || file.name.endsWith('.markdown'))) {
      readFile(file);
    } else if (file && !document.getElementById('merge-modal').classList.contains('active')) {
      toast('仅支持 .md / .txt 文件', 'error');
    }
  });
}

// ═══════════════════════════════════════════
// Resize Handle
// ═══════════════════════════════════════════
function setupResizeHandle() {
  const handle = document.getElementById('resize-handle');
  const editorArea = document.getElementById('editor-area');
  let isResizing = false;

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    const startX = e.clientX;
    const editorPane = editorArea.querySelector('.editor-pane');
    const startWidth = editorPane.getBoundingClientRect().width;
    const totalWidth = editorArea.getBoundingClientRect().width;

    const onMove = (e) => {
      if (!isResizing) return;
      const dx = e.clientX - startX;
      const newWidth = Math.max(300, Math.min(totalWidth - 300, startWidth + dx));
      const percent = (newWidth / totalWidth) * 100;
      editorPane.style.flex = `0 0 ${percent}%`;
    };

    const onUp = () => {
      isResizing = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ═══════════════════════════════════════════
// Keyboard Shortcuts
// ═══════════════════════════════════════════
function setupKeyboard() {
  document.addEventListener('keydown', (e) => {
    const isMod = e.metaKey || e.ctrlKey;

    if (isMod && e.key === 's') {
      e.preventDefault();
      saveMarkdown();
    }

    if (isMod && e.key === 'f') {
      e.preventDefault();
      toggleSearch();
    }

    if (e.key === 'Escape') {
      closeModal('confirm-modal');
      closeModal('merge-modal');
      const bar = document.getElementById('search-bar');
      if (bar.classList.contains('active')) toggleSearch();
    }
  });
}

// ═══════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════
function toast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    el.style.transition = '0.3s ease';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}
</script>
