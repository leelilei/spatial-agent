query_families:
  A:
    name: Space Syntax + AI
    target_corpus:
      - core
      - foundational
    query: '"space syntax" AND ("agent" OR "LLM" OR "language model" OR "simulation")'
    phase1_openalex:
      year_from: 1984
      per_page: 25
      pages: 1
      variants:
        - "space syntax agent simulation"
        - "space syntax agent based model"
        - "space syntax simulation artificial intelligence"
        - "space syntax large language model"
  B:
    name: Spatial Representation + Agent
    target_corpus:
      - core
    query: '"spatial representation" AND "multi-agent" AND ("social" OR "behavior")'
    phase1_openalex:
      year_from: 2022
      per_page: 25
      pages: 1
      variants:
        - "spatial representation multi agent social behavior"
        - "spatial representation language agents virtual world"
        - "environment representation llm agent social simulation"
        - "virtual world multi agent spatial behavior"
  C:
    name: LLM Spatial Reasoning
    target_corpus:
      - adjacent
    query: '"spatial reasoning" AND ("large language model" OR "LLM" OR "GPT")'
    phase1_openalex:
      year_from: 2020
      per_page: 25
      pages: 1
      variants:
        - "spatial reasoning large language model"
        - "spatially aware llm agent"
        - "vision language model spatial reasoning"
        - "spatial benchmark gpt language model"
  D:
    name: LLM Social Simulation
    target_corpus:
      - core
    query: '("generative agents" OR "LLM agent" OR "language agent") AND ("social simulation" OR "emergent behavior" OR "multi-agent" OR "sandbox" OR "virtual world" OR "NPC" OR "interactive simulacra" OR "social agent")'
    phase1_openalex:
      year_from: 2022
      per_page: 25
      pages: 1
      variants:
        - "generative agents social simulation"
        - "llm multi agent virtual world"
        - "language agent sandbox social behavior"
        - "npc llm social simulation"
  E:
    name: Spatial Cognition + Computation
    target_corpus:
      - foundational
    query: '"spatial configuration" AND ("social behavior" OR "movement" OR "interaction")'
    phase1_openalex:
      year_from: 1948
      per_page: 25
      pages: 1
      variants:
        - "spatial configuration social behavior"
        - "space syntax movement interaction"
        - "visibility graph social interaction"
        - "spatial cognition language and space"
