paper_fields:
  - paper_id
  - title
  - abstract
  - year
  - venue
  - url
  - doi
  - authors
  - source_families
  - final_status
  - corpus_tier
  - exclusion_reason
  - notes

system_fields:
  - system_name
  - environment_configuration
  - system_family
  - paper_refs
  - year
  - agent_count
  - environment_side_representation
  - agent_accessible_representation
  - representation_gap_note
  - behavioral_scale
  - behavior_type
  - evidence_status
  - spatial_behavior_coupling
  - evaluation_method
  - space_syntax_construct
  - notes

allowed_values:
  corpus_tier: [core, adjacent, foundational, excluded]
  exclusion_reason: [E1, E2, E3, E4, E5]
  agent_count: ["1", "2-10", "10-100", "100+"]
  environment_side_representation: [text-only, 2D_grid, 2.5D_isometric, 3D_engine, graph_based]
  agent_accessible_representation: [L0, L1, L2, L3, L4, L5]
  behavioral_scale: [local_action, interaction, emergent_social_structure]
  evidence_status: [observed_effect, designed_affordance_only, hypothesized_but_not_tested]
  spatial_behavior_coupling: [none, implicit, explicit]
  evaluation_method: [human_eval, auto_metric, llm_as_judge, mixed, none]
