<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4. Evidence-map matrix</title>
  <desc id="desc">A matrix crossing agent-accessible representation levels with behavioral scales and evidence status, plus marginal bars for anchor and bridge rows.</desc>
  <style>
    .bg { fill: #fbfaf4; }
    .title { font: 700 34px Helvetica, Arial, sans-serif; fill: #1f2d2a; }
    .subtitle { font: 700 21px Helvetica, Arial, sans-serif; fill: #1f2d2a; }
    .label { font: 700 17px Helvetica, Arial, sans-serif; fill: #263633; }
    .text { font: 16px Helvetica, Arial, sans-serif; fill: #263633; }
    .small { font: 14px Helvetica, Arial, sans-serif; fill: #4b5d58; }
    .tiny { font: 12px Helvetica, Arial, sans-serif; fill: #5b6864; }
    .grid { fill: #ffffff; stroke: #cad5ce; stroke-width: 1.4; }
    .zero { fill: #f1f0ea; stroke: #d5d3c9; stroke-width: 1.2; }
    .designed { fill: #f1d7a7; stroke: #c9892f; stroke-width: 1.2; }
    .observed { fill: #9ec5bd; stroke: #2f6b64; stroke-width: 1.2; }
    .anchor { fill: #2f6b3f; }
    .bridge { fill: #d9e8dc; stroke: #2f6b3f; stroke-width: 1.5; }
    .callout { fill: #fff1d6; stroke: #c47a20; stroke-width: 2; }
    .warn { fill: #f7e0dc; stroke: #b65c52; stroke-width: 2; }
  </style>

  <rect class="bg" width="1700" height="1120"/>
  <text class="title" x="70" y="64">Figure 4. Evidence-Map Matrix: Representation, Behavior, and Evidence Status</text>
  <text class="text" x="70" y="100">Stable widened Core: 34 coded rows from 32 paper-level sources. Matrix cells split designed affordance and observed effect counts.</text>

  <text class="subtitle" x="300" y="160">behavioral scale</text>
  <text class="label" x="360" y="210">interaction</text>
  <text class="label" x="675" y="210">emergent social structure</text>
  <text class="label" x="1085" y="210">mixed</text>
  <text class="subtitle" x="70" y="250">representation</text>

  <text class="label" x="80" y="312">L1 labels</text>
  <rect class="designed" x="320" y="270" width="240" height="78" rx="14"/>
  <text class="label" x="370" y="315">1 designed</text>
  <rect class="zero" x="640" y="270" width="320" height="78" rx="14"/>
  <text class="small" x="782" y="315">0</text>
  <rect class="zero" x="1040" y="270" width="240" height="78" rx="14"/>
  <text class="small" x="1152" y="315">0</text>

  <text class="label" x="80" y="422">L2 semantic scene</text>
  <rect class="designed" x="320" y="380" width="118" height="78" rx="14"/>
  <rect class="observed" x="442" y="380" width="118" height="78" rx="14"/>
  <text class="label" x="348" y="416">4 D</text>
  <text class="label" x="470" y="416">4 O</text>
  <rect class="zero" x="640" y="380" width="320" height="78" rx="14"/>
  <text class="small" x="782" y="425">0</text>
  <rect class="zero" x="1040" y="380" width="240" height="78" rx="14"/>
  <text class="small" x="1152" y="425">0</text>

  <text class="label" x="80" y="532">L3 local relations</text>
  <rect class="designed" x="320" y="490" width="240" height="78" rx="14"/>
  <text class="label" x="370" y="535">2 designed</text>
  <rect class="designed" x="640" y="490" width="96" height="78" rx="14"/>
  <rect class="observed" x="742" y="490" width="218" height="78" rx="14"/>
  <text class="label" x="662" y="525">3 D</text>
  <text class="label" x="800" y="525">8 O</text>
  <rect class="designed" x="1040" y="490" width="96" height="78" rx="14"/>
  <rect class="observed" x="1142" y="490" width="138" height="78" rx="14"/>
  <text class="label" x="1062" y="525">2 D</text>
  <text class="label" x="1185" y="525">3 O</text>

  <text class="label" x="80" y="642">L4 global abstract</text>
  <rect class="zero" x="320" y="600" width="240" height="78" rx="14"/>
  <text class="small" x="432" y="645">0</text>
  <rect class="observed" x="640" y="600" width="320" height="78" rx="14"/>
  <text class="label" x="740" y="645">1 observed</text>
  <rect class="zero" x="1040" y="600" width="240" height="78" rx="14"/>
  <text class="small" x="1152" y="645">0</text>

  <text class="label" x="80" y="752">L5 geometry / embodiment</text>
  <rect class="observed" x="320" y="710" width="240" height="78" rx="14"/>
  <text class="label" x="370" y="755">2 observed</text>
  <rect class="designed" x="640" y="710" width="320" height="78" rx="14"/>
  <text class="label" x="735" y="755">1 designed</text>
  <rect class="designed" x="1040" y="710" width="118" height="78" rx="14"/>
  <rect class="observed" x="1162" y="710" width="118" height="78" rx="14"/>
  <text class="label" x="1068" y="746">2 D</text>
  <text class="label" x="1190" y="746">1 O</text>

  <rect class="designed" x="80" y="840" width="28" height="18" rx="4"/>
  <text class="small" x="120" y="855">D = designed_affordance_only</text>
  <rect class="observed" x="350" y="840" width="28" height="18" rx="4"/>
  <text class="small" x="390" y="855">O = observed_effect</text>

  <text class="subtitle" x="1350" y="210">core-layer marginal</text>
  <text class="small" x="1350" y="240">anchor_core / bridge_core by level</text>
  <g transform="translate(1350,280)">
    <text class="small" x="0" y="0">L1</text>
    <rect class="anchor" x="45" y="-16" width="16" height="16"/><text class="tiny" x="70" y="-3">1</text>
    <rect class="bridge" x="110" y="-16" width="16" height="16"/><text class="tiny" x="135" y="-3">0</text>
    <text class="small" x="0" y="68">L2</text>
    <rect class="anchor" x="45" y="52" width="16" height="16"/><text class="tiny" x="70" y="65">0</text>
    <rect class="bridge" x="110" y="52" width="128" height="16"/><text class="tiny" x="248" y="65">8</text>
    <text class="small" x="0" y="136">L3</text>
    <rect class="anchor" x="45" y="120" width="240" height="16"/><text class="tiny" x="295" y="133">15</text>
    <rect class="bridge" x="45" y="142" width="48" height="16"/><text class="tiny" x="103" y="155">3</text>
    <text class="small" x="0" y="226">L4</text>
    <rect class="anchor" x="45" y="210" width="16" height="16"/><text class="tiny" x="70" y="223">0</text>
    <rect class="bridge" x="110" y="210" width="16" height="16"/><text class="tiny" x="135" y="223">1</text>
    <text class="small" x="0" y="294">L5</text>
    <rect class="anchor" x="45" y="278" width="48" height="16"/><text class="tiny" x="103" y="291">3</text>
    <rect class="bridge" x="110" y="278" width="48" height="16"/><text class="tiny" x="168" y="291">3</text>
  </g>

  <rect class="callout" x="80" y="900" width="460" height="115" rx="22"/>
  <text class="label" x="115" y="940">Dense center: L3</text>
  <text class="small" x="115" y="970">Local relations dominate the strict anchor core.</text>
  <text class="small" x="115" y="995">This supports mapping, not mechanism by itself.</text>

  <rect class="warn" x="610" y="900" width="460" height="115" rx="22"/>
  <text class="label" x="645" y="940">L4 bridge-only</text>
  <text class="small" x="645" y="970">The only L4 row is a digital-network bridge case.</text>
  <text class="small" x="645" y="995">It is not strict anchor Space Syntax validation.</text>

  <rect class="callout" x="1140" y="900" width="460" height="115" rx="22"/>
  <text class="label" x="1175" y="940">Observed effects uneven</text>
  <text class="small" x="1175" y="970">Observed rows exist, but vary by layer, level, and behavior.</text>
  <text class="small" x="1175" y="995">Bridge recovery is not anchor evidence.</text>
</svg>
