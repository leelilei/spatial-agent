experiment:
  name: "preflight_v7"
  layout_path: "configs/layouts/plaza.yaml"
  output_dir: "results/preflight"

io:
  tasks_dir: "results/preflight/tasks"
  raw_dir: "results/preflight/raw"
  scored_dir: "results/preflight/scored"
  reports_dir: "results/preflight/reports"

metrics:
  high_control_quantile: 0.8
  h2_metric_correlation_threshold: 0.8

llm_gate:
  choice_options:
    quantiles: ["high", "mid", "low"]
  prompt_positions:
    - "system_prefix"
    - "memory_suffix"
    - "action_context"

models:
  gpt54:
    provider: "openai_compatible"
    model: "gpt-5.4"
    api_key_env: "OPENAI_API_KEY"
    base_url_env: "OPENAI_BASE_URL"
    base_url: "https://api.openai.com/v1"
    wire_api: "chat_completions"
    temperature: 0.0
    max_tokens: 300
  primary:
    provider: "openai_compatible"
    model: "qwen3.5-plus"
    api_key_env: "QWEN_API_KEY"
    base_url_env: "QWEN_BASE_URL"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    temperature: 0.0
    max_tokens: 300
  robustness:
    provider: "openai_compatible"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url_env: "DEEPSEEK_BASE_URL"
    base_url: "https://api.deepseek.com"
    temperature: 0.0
    max_tokens: 300

thresholds:
  comprehension_accuracy: 0.85
  behavioral_inference_accuracy: 0.70
  reverse_inference_leak_cutoff: 0.65
  prompt_position_min_accuracy: 0.70
  lexical_primary_gap_min: 1.5
  lexical_nuisance_spread_max: 1.25

lexical_norming:
  candidate_labels:
    - "market square"
    - "ceremonial courtyard"
    - "guard post"
    - "quiet archive"
    - "private alcove"
    - "service alley"
    - "lantern plaza"
    - "back garden"
  dimensions:
    - "publicness"
    - "privacy"
    - "danger"
    - "valence"
    - "brightness"

mic_pilot:
  seeds: 10
  conditions: ["C1", "C6m", "C4"]
  comparisons:
    - ["C6m", "C1"]
    - ["C4", "C1"]
  dvs:
    - "tar_h1_run"
    - "tar_h2_run"
    - "entropy_run"
  num_agents: 10
  num_rounds: 150
  window_size: 50
  min_location_visits: 5
  unmatched_bootstrap: 200

convergence_pilot:
  seeds: 8
  condition: "C4"
  num_agents: 10
  num_rounds: 220
  window_size: 20
  delta_threshold: 0.2
  min_stable_windows: 3
  holdout_rounds: 50

coding_pilot_llm_subset:
  labels:
    behavior_type: ["social", "privacy", "gatekeeping", "other"]
    interaction_intensity: ["low", "medium", "high"]
    information_sensitivity: ["low", "medium", "high"]
    gatekeeping: ["absent", "present"]
  samples:
    - id: "cp001"
      behavior_text: "Mira waves two travelers over in the lantern plaza and starts a lively public conversation about tonight's festival."
    - id: "cp002"
      behavior_text: "Ren lowers his voice and asks Toma to step into the archive room before mentioning a rumor about the guild treasurer."
    - id: "cp003"
      behavior_text: "Captain Ives remains by the watch gate, stopping passersby to ask where they are headed before letting them continue."
    - id: "cp004"
      behavior_text: "Sera lingers in the back garden, quietly listening while another agent vents about a private family dispute."
